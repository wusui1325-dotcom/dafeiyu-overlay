name: Build & Auto Release APK

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Resolve Release Tag
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version_name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Decode Fixed Release Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/dafeiyu-release.jks"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/dafeiyu-release.jks" >> "$GITHUB_ENV"
            echo "Fixed release keystore decoded."
          else
            echo "No release keystore secret set; falling back to debug signing."
          fi

      - name: Build Release APK
        env:
          RELEASE_VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle assembleRelease --stacktrace

      - name: Rename Release APK
        run: |
          mkdir -p release_apks
          cp app/build/outputs/apk/release/app-release.apk "release_apks/dafeiyu-overlay-${{ steps.meta.outputs.tag }}.apk"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: dafeiyu-overlay-${{ steps.meta.outputs.tag }}
          path: release_apks/*.apk
          retention-days: 30

      - name: Publish GitHub Release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: "大肥魚 DaFeiYu ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          make_latest: true
          files: release_apks/*.apk
